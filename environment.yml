# Reproducible conda environment for running the anuga_drainage examples.
#
#   conda env create -f environment.yml
#   conda activate anuga_drainage
#
# This installs ANUGA 4.1.0 from conda-forge plus this package and both 1D
# backends. Notes:
#   * conda-forge ships ANUGA 4.1.0 for Python 3.11-3.14, and this file
#     targets 3.12 for a one-command install of the released ANUGA. The
#     maintainer's dev box instead runs ANUGA built from source on
#     Python 3.14 — see CLAUDE.md.
#   * The 1D backends and this package come via pip from the project's extras
#     (see pyproject.toml). pipedream-solver comes from the anuga-community
#     fork's `anuga` branch, which carries the numpy 2 and pandas 3 fixes
#     upstream has not merged (mdbartos/pipedream#73, #74).
#   * Run `conda env create` from the repository root so the editable install
#     (`-e .`) picks up this package.
name: anuga_drainage
channels:
  - conda-forge
dependencies:
  - python=3.12
  - anuga=4.1.0
  - pandas
  - matplotlib
  - pip
  - pip:
      - -e .[swmm,pipedream,test]
