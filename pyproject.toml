[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Allow the git direct reference in the `pipedream` optional-dependency
# (pipedream-solver @ git+https://...).
[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "anuga_drainage"
version = "0.0.1"
authors = [
  { name="Stephen Roberts", email="stephen.roberts@anu.edu.au" },
]
description = "Coupling anuga with SWMM and pipedream"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Runtime deps of the package itself. ANUGA is intentionally NOT listed: it is
# provided by the conda environment, not pip-installed (see CLAUDE.md). The 1D
# backends are optional extras below.
dependencies = [
    "numpy",
    "pandas",
]

[project.optional-dependencies]
# SWMM backend (standard PyPI release).
swmm = ["pyswmm>=2.1"]
# pipedream backend, from the anuga-community fork's `anuga` branch. That is
# upstream master plus two fixes upstream has not merged (it has had no commit
# since 2024): np.bool8 -> np.bool_ for numpy 2.x (mdbartos/pipedream#73) and
# writable storage-type masks for pandas 3's Copy-on-Write
# (mdbartos/pipedream#74). Neither the PyPI release (0.2.2) nor upstream
# master works with a current numpy/pandas. Switch back to upstream once both
# are merged and released.
pipedream = [
    "pipedream-solver @ git+https://github.com/anuga-community/pipedream.git@anuga",
]
test = ["pytest"]
# Hydrograph viewer GUI (Tkinter is stdlib; numpy/pandas are core deps).
viewer = ["matplotlib"]
# Documentation (Sphinx + MyST), also pinned in docs/requirements.txt for RTD.
# jupytext keeps docs/tutorial.ipynb paired with docs/tutorial.py (authoring/sync
# only; RTD renders the committed .ipynb and doesn't need it at build time).
docs = ["sphinx>=7", "myst-nb>=1", "sphinx-rtd-theme>=2", "jupytext>=1.16"]

[project.scripts]
anuga-drainage-viewer = "anuga_drainage.viewer:main"

[project.urls]
"Homepage" = "https://github.com/anuga-community/anuga_drainage"
"Bug Tracker" = "https://github.com/anuga-community/anuga_drainage/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
